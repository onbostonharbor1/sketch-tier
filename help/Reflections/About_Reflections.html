<h1>About Reflections</h1>
<p>Reflections are Barry's own notes on Sketchpad: thoughts on design, what worked, what didn't, what to try.
Create one with <b>New reflection...</b> on Home &gt; Help; it is listed here by its title. Choose one and press
<b>Edit</b> to change it. Each is an HTML file in <code>help/Reflections</code>.</p>
